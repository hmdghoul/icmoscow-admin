<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IC Moscow Admin Portal</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into a query param so the
      // server's 404 page can redirect to index.html, which then restores it.
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1).join('/') +
          '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
</html>
